{% extends "governance/base.html" %}

{% block title %}Delete Governance Record{% endblock %}

{% block content %}
<h1 class="mb-4">Delete Governance Record</h1>
<p>Are you sure you want to delete the governance record "<strong>{{ object.title }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <a href="{% url 'governance:governance_record_list' %}" class="btn btn-secondary me-2">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </div>
</form>
{% endblock %}
