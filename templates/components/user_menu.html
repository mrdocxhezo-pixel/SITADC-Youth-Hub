<div class="dropdown">
    <a href="#"
       class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle"
       id="userMenuDropdown"
       data-bs-toggle="dropdown"
       aria-expanded="false">
        {% if request.user.profile.profile_photo %}
            <img src="{{ request.user.profile.profile_photo.url }}"
                 class="rounded-circle me-2"
                 style="width: 32px;
                        height: 32px;
                        object-fit: cover"
                 alt="{{ request.user.full_name }}">
        {% else %}
            <div class="bg-primary-brand text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                 style="width: 32px;
                        height: 32px">
                <span class="small fw-bold">{{ request.user.first_name|slice:":1"|upper }}{{ request.user.last_name|slice:":1"|upper }}</span>
            </div>
        {% endif %}
        <span class="d-none d-md-block small fw-semibold">{{ request.user.full_name|default:request.user.username }}</span>
    </a>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2"
        aria-labelledby="userMenuDropdown">
        <li><a class="dropdown-item py-2" href="{% url 'core:profile' %}"><i class="bi bi-person me-2 text-muted"></i> Profile</a></li>
        <li><a class="dropdown-item py-2" href="{% url 'core:password_change' %}"><i class="bi bi-shield-lock me-2 text-muted"></i> Change Password</a></li>
        <li><a class="dropdown-item py-2" href="{% url 'core:sessions' %}"><i class="bi bi-laptop me-2 text-muted"></i> Active Sessions</a></li>
        <li>
            <hr class="dropdown-divider">
        </li>
        <li>
            <a class="dropdown-item py-2 text-danger" href="{% url 'core:logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i> Sign out
            </a>
        </li>
    </ul>
</div>
