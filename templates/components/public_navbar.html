{% load static %}
<nav class="navbar navbar-expand-lg bg-white shadow-sm"
     aria-label="Main Navigation">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary-brand text-decoration-none"
           href="{% url 'core:home' %}"
           aria-label="Go to SITADC Youth Hub homepage">
            {% include 'components/branding/logo.html' with logo_class="navbar-brand-logo" %}
            <span class="navbar-brand-text">{{ organization_name|default:"SITADC Youth Hub" }}</span>
        </a>
        <button class="navbar-toggler border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPublic"
                aria-controls="navbarPublic"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarPublic">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link fw-medium {% if request.resolver_match.url_name == 'home' %}active text-primary-brand{% endif %}"
                       href="{% url 'core:home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-medium {% if request.resolver_match.url_name == 'about' %}active text-primary-brand{% endif %}"
                       href="{% url 'core:about' %}">About</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-primary-brand btn-sm px-3"
                       href="{% url 'core:login' %}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
