<header class="dashboard-topbar bg-white shadow-sm d-flex align-items-center justify-content-between px-3 px-md-4">
    <div class="d-flex align-items-center">
        <button id="sidebarToggle" class="btn btn-link text-dark p-0 me-3 d-md-none">
            <i class="bi bi-list fs-4"></i>
        </button>
        <!-- Search -->
        <div class="d-none d-md-flex position-relative">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="text"
                   class="form-control bg-light border-0 ps-5 rounded-pill"
                   placeholder="Search..."
                   aria-label="Search">
        </div>
    </div>
    <!-- Top Right Actions -->
    <div class="d-flex align-items-center gap-3">
        <!-- Notification Bell -->
        <div class="dropdown">
            <button class="btn btn-link text-dark p-0 position-relative"
                    type="button"
                    id="notificationDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">New alerts</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 py-0"
                aria-labelledby="notificationDropdown"
                style="min-width: 300px">
                <li class="bg-light p-2 border-bottom fw-bold text-center">Notifications</li>
                <li><a class="dropdown-item py-3 border-bottom text-wrap" href="#"><small class="fw-bold d-block">Pending Approval</small><span class="text-muted small">Volunteer application needs review.</span></a></li>
                <li>
                    <hr class="dropdown-divider my-0">
                </li>
                <li><a class="dropdown-item text-center small text-primary-brand py-2"
   href="#">View all</a></li>
            </ul>
        </div>
        <!-- User Menu -->
        {% include 'components/user_menu.html' %}
    </div>
</header>
