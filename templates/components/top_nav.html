<header class="dashboard-topbar bg-white shadow-sm d-flex align-items-center justify-content-between px-3 px-md-4"
        role="banner">
    <div class="d-flex align-items-center">
        <button id="sidebarToggle"
                class="btn btn-link text-dark p-0 me-3 d-md-none"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="sidebar"
                data-bs-toggle="sidebar"
                data-bs-target="#sidebar">
            <i class="bi bi-list fs-4" aria-hidden="true"></i>
        </button>
        <!-- Search -->
        <form class="d-none d-md-flex position-relative"
              action="{% url 'search:home' %}"
              method="get"
              role="search">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
               aria-hidden="true"></i>
            <input type="text"
                   name="q"
                   class="form-control bg-light border-0 ps-5 rounded-pill"
                   placeholder="Search..."
                   aria-label="Search">
        </form>
    </div>
    <!-- Top Right Actions -->
    <div class="d-flex align-items-center gap-3">
        <!-- Notification Bell -->
        <div class="dropdown">
            <button class="btn btn-link text-dark p-0 position-relative"
                    type="button"
                    id="notificationDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Notifications">
                <i class="bi bi-bell fs-5" aria-hidden="true"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none"
                      data-notification-badge
                      aria-hidden="true"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 py-0"
                aria-labelledby="notificationDropdown"
                style="min-width: 300px">
                <li class="bg-light p-2 border-bottom fw-bold text-center">Notifications</li>
                <li id="notificationDropdownList">
                    <span class="dropdown-item text-muted small py-3">Loading...</span>
                </li>
                <li><a class="dropdown-item text-center small text-primary-brand py-2"
   href="{% url 'notifications:inbox' %}">View all</a></li>
            </ul>
        </div>
        <!-- User Menu -->
        {% include 'components/user_menu.html' %}
    </div>
</header>
