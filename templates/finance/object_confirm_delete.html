{% extends "layouts/dashboard.html" %}

{% block title %}Delete Record - SITADC Youth Hub{% endblock %}

{% block dashboard_content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h2>Delete Record</h2>
    </div>
    <div class="col-md-4 text-md-end">
        <a href="{{ list_url }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to List
        </a>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Are you sure you want to delete "<strong>{{ object }}</strong>"? This action cannot be undone.
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ list_url }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i> Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
