<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Finance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'finance:budget_list' %}">Finance</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:budget_list' %}">Budgets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:donation_list' %}">Donations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:expense_list' %}">Expenses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:financial_year_list' %}">Financial Years</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:fund_list' %}">Funds</a>
                    </li
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:grant_list' %}">Grants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:invoice_list' %}">Invoices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:investment_list' %}">Investments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:loan_list' %}">Loans</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:sponsorship_list' %}">Sponsorships</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'finance:transaction_list' %}">Transactions</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
