{% extends "layouts/dashboard.html" %}
{% block title %}Initiate Exit Process | SITADC Youth Hub{% endblock title %}
{% block dashboard_content %}
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Initiate Volunteer Exit & Alumni Process</h1>
            <a href="{% url 'volunteers:exit_list' %}"
               class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">{% include "volunteers/includes/form_fields.html" %}</div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-danger px-4"><i class="bi bi-box-arrow-right me-1"></i>Process Exit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock dashboard_content %}
