<nav class="mb-4" aria-label="Programs and projects module">
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-sm btn-outline-secondary"
           href="{% url 'programs:dashboard' %}"><i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Dashboard</a>
        <a class="btn btn-sm btn-outline-secondary"
           href="{% url 'programs:program_directory' %}"><i class="bi bi-collection me-1" aria-hidden="true"></i>Programs</a>
        <a class="btn btn-sm btn-outline-secondary"
           href="{% url 'programs:project_directory' %}"><i class="bi bi-kanban me-1" aria-hidden="true"></i>Projects</a>
        {% if program %}
            <span class="border-start mx-1" aria-hidden="true"></span>
            <a class="btn btn-sm btn-outline-primary"
               href="{% url 'programs:program_profile' program.pk %}">Program: {{ program.reference_number }}</a>
        {% elif project %}
            <span class="border-start mx-1" aria-hidden="true"></span>
            <a class="btn btn-sm btn-outline-primary"
               href="{% url 'programs:project_profile' project.pk %}">Project: {{ project.reference_number }}</a>
        {% endif %}
    </div>
</nav>
